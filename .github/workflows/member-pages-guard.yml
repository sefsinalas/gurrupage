name: Validate member page

on:
  pull_request:
    branches: [main]
    paths:
      - "public/member-sites/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate assigned folder
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF}"
          if [[ "$branch" =~ ^member/([a-z0-9-]+)/ ]]; then
            slug="${BASH_REMATCH[1]}"
            node scripts/validate-member-site.mjs "$slug" --base "origin/${GITHUB_BASE_REF}"
          else
            node -e 'for (const member of require("./src/data/member-pages.json").members) console.log(member.slug)' |
              while read -r slug; do
                node scripts/validate-member-site.mjs "$slug"
              done
          fi
      - run: npm run build
