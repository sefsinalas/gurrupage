name: Open member page pull request

on:
  push:
    branches:
      - "member/**"
      - "game1/**"

permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          existing="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            if [[ "$BRANCH" =~ ^member/([a-z0-9-]+)/ ]]; then
              title="Actualizar página de ${BASH_REMATCH[1]}"
              body="Cambio solicitado desde WhatsApp para una página personal."
            elif [[ "$BRANCH" =~ ^game1/[a-z0-9-]+$ ]]; then
              title="Actualizar Juego 1"
              body="Idea para el juego solicitada desde WhatsApp."
            else
              echo "Invalid bot branch" >&2
              exit 1
            fi
            pr_url="$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$title" \
              --body "$body La validación y el merge son automáticos si el cambio respeta los límites.")"
            existing="${pr_url##*/}"
          fi

          gh workflow run member-auto-merge.yml --ref main -f pr_number="$existing"
